  <style>
    :root {
      --bg-main: #07050d;
      --bg-card: #120e21;
      --bg-card-hover: #1b1432;
      --primary: #7b2cbf;
      --accent: #00ff87;
      --accent-glow: rgba(0, 255, 135, 0.2);
      --gold: #ffd700;
      --text-main: #f3f0ff;
      --text-muted: #948fa6;
      --border: #2c1a4d;
      --border-glow: #7b2cbf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      padding: 30px 15px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(123, 44, 191, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 255, 135, 0.05) 0%, transparent 40%);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-family: 'Cinzel', serif;
      color: var(--accent);
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px var(--accent-glow);
      letter-spacing: 1px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Status Banner */
    .status-banner {
      background: linear-gradient(135deg, #120e21 0%, #1a1235 100%);
      border: 1px solid var(--border);
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .status-banner strong {
      color: var(--gold);
    }

    /* Modern Tab Navigation */
    .nav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--primary);
    }

    .nav-btn.active {
      background: var(--primary);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(123, 44, 191, 0.5);
    }

    /* Content Sections */
    .section {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 35px;
      margin-bottom: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      animation: fadeIn 0.4s ease-in-out;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      margin-bottom: 20px;
      font-size: 1.8rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

name: Run Warlock Auto Scanner

on:
  schedule:
    # Kontrollera varje timme efter nya Warlock-ändringar
    - cron: '13 * * * *'
  workflow_dispatch: # Gör att du kan köra den manuellt från GitHub-sidan när du vill

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push changes if warlock_patches.json was updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add warlock_patches.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update patch news" && git push)
